seed = 3
batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true

[data]
cache = true
path = "data/cooking-time"
cat_policy = "ordinal"

[optimizer]
type = "AdamW"
lr = 0.00012065020494450812
weight_decay = 0.07000081679295954

[model]
arch_type = "tabm"
k = 32
share_training_batches = false

[model.backbone]
type = "MLP"
n_blocks = 1
d_block = 416
dropout = 0.0

[model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 16

[bins]
n_bins = 8

[cf_fisd]
lambda = 0.1
variant = "raw"
teacher_dir = "exp/cf_fisd/_teachers/tabred/cooking-time_consensus"
dataset_name = "cooking-time"
teacher_names = ["xgb", "lgbm", "cat"]
