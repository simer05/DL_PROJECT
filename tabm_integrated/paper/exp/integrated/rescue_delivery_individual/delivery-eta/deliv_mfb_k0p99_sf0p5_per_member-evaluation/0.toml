batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true
seed = 0
head_selection = true

[data]
cache = true
path = "data/delivery-eta"
cat_policy = "ordinal"

[optimizer]
lr = 0.0025639267063470926
weight_decay = 0.0507074044872309

[model]
arch_type = "tabm"
k = 32
share_training_batches = false

[model.backbone]
n_blocks = 2
d_block = 752
dropout = 0.18437573041970334

[model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 32

[model.mfb]
enabled = true
mask_mode = "member_fixed"
mask_granularity = "feature_group"
keep_rate = 0.99
training_only = false
inverted_scaling = true
use_soft_mask = false
mask_strength = 1.0
anchor_fraction = 0.0
warmup_epochs = 0
mask_seed = 0
start_epoch = 16
start_fraction = 0.5
group_mode = "per_member"
categorical_handling = "no_cat_drop"

[bins]
n_bins = 81
