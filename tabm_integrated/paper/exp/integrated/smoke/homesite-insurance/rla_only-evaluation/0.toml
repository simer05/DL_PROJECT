batch_size = 1024
patience = 16
n_epochs = -1
gradient_clipping_norm = 1.0
amp = true
seed = 0
head_selection = true
rla_adapter_lr_multiplier = 1.0
rla_extra_paths_freeze_fraction = 0.0

[data]
cache = true
path = "data/homesite-insurance"
num_policy = "noisy-quantile"
cat_policy = "ordinal"

[optimizer]
lr = 0.0018580623030886075
weight_decay = 0.0001614529849348179

[model]
arch_type = "tabm"
k = 32
share_training_batches = false
rla_rank = 4
rla_first_only = false
rla_additive = false
rla_init = "base_preserving"
rla_base_preserve_noise = 0.0001

[model.backbone]
n_blocks = 3
d_block = 704
dropout = 0.0

[model.num_embeddings]
type = "PiecewiseLinearEmbeddings"
d_embedding = 8

[bins]
n_bins = 15
